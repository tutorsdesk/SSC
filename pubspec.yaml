name: tutors_desk
description: "Tutor's Desk - SSC 2027 question-paper studio for tutors"
publish_to: 'none'
version: 1.0.6+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3          # SHA-256 check of downloaded app updates
  shared_preferences: ^2.2.2
  pdf: ^3.11.0
  printing: ^5.15.0
  # ইমেইল OTP লগইন + Pro সিংক (Supabase)
  supabase_flutter: ^2.8.0
  phosphoricons_flutter: ^1.0.0  # fallback for any future unmapped icon
  flutter_svg: ^2.0.10+1       # supplied Streamline SVG icon set
  # OMR scanner + question-paper library
  image_picker: ^1.1.0   # OMR শিট / প্রশ্নপত্রের ফটো (ক্যামেরা + গ্যালারি)
  camera: ^0.12.1        # লাইভ ক্যামেরা প্রিভিউ + গাইডেড অটো-ক্যাপচার (OMR)
  camera_windows: 0.2.6+2 # Windows webcam implementation (manual capture)
  google_mlkit_document_scanner: ^0.6.1  # Google ডকুমেন্ট স্ক্যানার — শিট শনাক্ত/অটো-ক্যাপচার (ML Kit)
  image: ^4.2.0          # pure-Dart image processing (OMR bubble reading)
  file_picker: ^8.1.2    # PDF প্রশ্নপত্র যোগ করা
  path_provider: ^2.1.0  # যোগ করা প্রশ্নপত্র ডিভাইসে সংরক্ষণ
  connectivity_plus: ^6.0.0  # offline detection (global banner + app-open error)
  url_launcher: ^6.3.0       # open the Rupantor Pay checkout

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: DejaVu Sans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: Hind Siliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
    - family: Noto Serif Bengali
      fonts:
        - asset: assets/fonts/NotoSerifBengali-Regular.ttf
        - asset: assets/fonts/NotoSerifBengali-Bold.ttf
          weight: 700
    - family: Bartino
      fonts:
        - asset: assets/fonts/Bartino-Regular.ttf
    - family: Bartino Outline
      fonts:
        - asset: assets/fonts/BartinoOutline-Regular.ttf
  assets:
    - assets/questions/
    - New UI 4.0/
    - New UI 4.0/Logo 2.png
    - assets/question_figures/
    - assets/icon/icon.png
    - assets/icon/icon_foreground.png
    - assets/icons/
    - assets/fonts/NotoSerifBengali-Regular.ttf
    - assets/fonts/NotoSerifBengali-Bold.ttf
    - assets/fonts/Bartino-Regular.ttf
    - assets/fonts/BartinoOutline-Regular.ttf
    - assets/fonts/HindSiliguri-Regular.ttf
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/dictionary/en_words.txt
    - assets/dictionary/LICENSE-SCOWL.txt
    - assets/dictionary/bn_words.txt
    - assets/dictionary/LICENSE-bangla-wordlist.txt

flutter_launcher_icons:
  android: true
  # Logo 1: use the supplied app-icon artwork at its full supplied canvas.
  # Do not pass it as an adaptive foreground: Android's adaptive safe-zone
  # crop zooms the artwork and changes the supplied proportions.
  image_path: "New UI 4.0/Logo 1.png"
  min_sdk_android: 21
